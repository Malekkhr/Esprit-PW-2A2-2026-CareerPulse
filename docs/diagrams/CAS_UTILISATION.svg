<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1200" viewBox="0 0 1680 1200" role="img" aria-labelledby="title desc">
  <title id="title">CareerPulse — diagramme de cas d’utilisation</title>
  <desc id="desc">Diagramme UML du système CareerPulse avec les acteurs Étudiant et Administrateur, leurs cas d’utilisation, et un cas partagé d’authentification.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#183B2C" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #20332B; }
      text.header-title { fill: #FFFFFF; }
      text.header-eyebrow { fill: #E8C76F; }
      text.header-subtitle { fill: #C7D6CD; }
      .association { stroke: #91A198; stroke-width: 2.1; fill: none; stroke-linecap: round; }
      .student-case { fill: #FFFFFF; stroke: #418263; stroke-width: 2.2; }
      .admin-case { fill: #FFFFFF; stroke: #D69B2B; stroke-width: 2.2; }
      .case-label { font-size: 18px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1680" height="1200" fill="#F2F6F3"/>
  <rect x="24" y="22" width="1632" height="1156" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>

  <rect x="24" y="22" width="1632" height="140" rx="26" fill="#102D23"/>
  <path d="M24 146 H1656" stroke="#E5B64B" stroke-width="5"/>
  <text x="72" y="64" class="header-eyebrow" fill="#E8C76F" font-size="15" font-weight="700" letter-spacing="2.2">CAREERPULSE · PROJET PI WEB 2A</text>
  <text x="72" y="108" class="header-title" fill="#FFFFFF" font-size="36" font-weight="700">Diagramme de cas d’utilisation</text>
  <text x="72" y="137" class="header-subtitle" fill="#C7D6CD" font-size="17">Système cible · Parcours étudiant et administration</text>

  <!-- System boundary and actor domains -->
  <rect x="222" y="196" width="1236" height="925" rx="22" fill="#FFFFFF" stroke="#244D3B" stroke-width="2.4"/>
  <rect x="657" y="174" width="366" height="46" rx="15" fill="#153D2D"/>
  <text x="840" y="203" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle">Système CareerPulse</text>

  <rect x="260" y="350" width="560" height="670" rx="20" fill="#F7FBF8" stroke="#D4E4D9" stroke-width="1.5"/>
  <rect x="860" y="350" width="560" height="670" rx="20" fill="#FFFBF2" stroke="#F0E1C3" stroke-width="1.5"/>
  <circle cx="302" cy="389" r="7" fill="#418263"/>
  <text x="322" y="395" font-size="18" font-weight="750" letter-spacing="1.1" fill="#2B6447">ESPACE ÉTUDIANT</text>
  <text x="780" y="395" font-size="13" font-weight="600" text-anchor="end" fill="#71907F">8 cas</text>
  <path d="M286 414 H794" stroke="#DCE9E0" stroke-width="1.2"/>
  <circle cx="902" cy="389" r="7" fill="#D69B2B"/>
  <text x="922" y="395" font-size="18" font-weight="750" letter-spacing="1.1" fill="#9B6D14">ADMINISTRATION</text>
  <text x="1380" y="395" font-size="13" font-weight="600" text-anchor="end" fill="#A8874E">6 cas</text>
  <path d="M886 414 H1394" stroke="#F0E4CC" stroke-width="1.2"/>

  <!-- Associations are deliberately drawn before the use-case ellipses. -->
  <!-- Shared authentication -->
  <path class="association" d="M120 240 L657 260"/>
  <path class="association" d="M1560 240 L1023 260"/>
  <!-- Student associations -->
  <path class="association" d="M120 240 L320 455"/>
  <path class="association" d="M120 240 L320 525"/>
  <path class="association" d="M120 240 L320 595"/>
  <path class="association" d="M120 240 L320 665"/>
  <path class="association" d="M120 240 L320 735"/>
  <path class="association" d="M120 240 L320 805"/>
  <path class="association" d="M120 240 L320 875"/>
  <path class="association" d="M120 240 L320 945"/>
  <!-- Administrator associations -->
  <path class="association" d="M1560 240 L1360 485"/>
  <path class="association" d="M1560 240 L1360 565"/>
  <path class="association" d="M1560 240 L1360 645"/>
  <path class="association" d="M1560 240 L1360 725"/>
  <path class="association" d="M1560 240 L1360 805"/>
  <path class="association" d="M1560 240 L1360 885"/>

  <!-- Shared use case -->
  <ellipse cx="840" cy="260" rx="183" ry="38" fill="#F4F8F5" stroke="#418263" stroke-width="2.4"/>
  <text x="840" y="260" class="case-label" font-size="19">S’authentifier</text>

  <!-- Student use cases -->
  <ellipse cx="540" cy="455" rx="220" ry="29" class="student-case"/><text x="540" y="455" class="case-label">Gérer son profil</text>
  <ellipse cx="540" cy="525" rx="220" ry="29" class="student-case"/><text x="540" y="525" class="case-label">Importer / actualiser son CV</text>
  <ellipse cx="540" cy="595" rx="220" ry="29" class="student-case"/><text x="540" y="595" class="case-label">Parcourir offres et formations</text>
  <ellipse cx="540" cy="665" rx="220" ry="29" class="student-case"/><text x="540" y="665" class="case-label">Passer le questionnaire</text>
  <ellipse cx="540" cy="735" rx="220" ry="29" class="student-case"/><text x="540" y="735" class="case-label">Consulter les recommandations</text>
  <ellipse cx="540" cy="805" rx="220" ry="29" class="student-case"/><text x="540" y="805" class="case-label">Postuler en un clic</text>
  <ellipse cx="540" cy="875" rx="220" ry="29" class="student-case"/><text x="540" y="875" class="case-label">Suivre ses candidatures</text>
  <ellipse cx="540" cy="945" rx="220" ry="29" class="student-case"/><text x="540" y="945" class="case-label">Recevoir une notification push</text>

  <!-- Administration use cases -->
  <ellipse cx="1140" cy="485" rx="220" ry="30" class="admin-case"/><text x="1140" y="485" class="case-label">Gérer les offres</text>
  <ellipse cx="1140" cy="565" rx="220" ry="30" class="admin-case"/><text x="1140" y="565" class="case-label">Gérer les candidatures</text>
  <ellipse cx="1140" cy="645" rx="220" ry="30" class="admin-case"/><text x="1140" y="645" class="case-label">Modérer les utilisateurs</text>
  <ellipse cx="1140" cy="725" rx="220" ry="30" class="admin-case"/><text x="1140" y="725" class="case-label">Traiter les signalements</text>
  <ellipse cx="1140" cy="805" rx="220" ry="30" class="admin-case"/><text x="1140" y="805" class="case-label">Consulter les statistiques</text>
  <ellipse cx="1140" cy="885" rx="220" ry="30" class="admin-case"/><text x="1140" y="885" class="case-label">Gérer les notifications</text>

  <!-- Student actor -->
  <circle cx="92" cy="208" r="16" fill="#FFFFFF" stroke="#335E49" stroke-width="3"/>
  <path d="M92 224 V270 M65 240 H120 M92 270 L72 298 M92 270 L112 298" fill="none" stroke="#335E49" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="307" width="100" height="32" rx="11" fill="#E8F2EB" stroke="#C7DDCE"/>
  <text x="92" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#2F6146">Étudiant</text>

  <!-- Administrator actor -->
  <circle cx="1588" cy="208" r="16" fill="#FFFFFF" stroke="#9B6D14" stroke-width="3"/>
  <path d="M1588 224 V270 M1560 240 H1616 M1588 270 L1568 298 M1588 270 L1608 298" fill="none" stroke="#9B6D14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1522" y="307" width="132" height="32" rx="11" fill="#FFF4D9" stroke="#EAD7A9"/>
  <text x="1588" y="328" font-size="15" font-weight="700" text-anchor="middle" fill="#8C6318">Administrateur</text>

  <!-- Footer legend -->
  <circle cx="476" cy="1074" r="7" fill="#418263"/>
  <text x="494" y="1080" font-size="15" font-weight="600" fill="#557163">Parcours étudiant</text>
  <circle cx="710" cy="1074" r="7" fill="#D69B2B"/>
  <text x="728" y="1080" font-size="15" font-weight="600" fill="#8B7549">Parcours administrateur</text>
  <text x="840" y="1110" font-size="14" text-anchor="middle" fill="#718078">Le diagramme décrit le périmètre fonctionnel cible; certaines fonctions ne sont pas encore disponibles dans la V4.</text>
</svg>
