<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">CareerPulse V4 — diagramme de classes</title>
<desc id="desc">Six classes persistées dans MySQL, avec les relations de clés étrangères entre Utilisateur, Offre et Candidature.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#153D2D" flood-opacity=".09"/></filter><style>
 text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#20332B}.mono{font-family:Consolas,"Courier New",monospace;font-size:17px}.header{fill:#153D2D}.title{fill:#FFFFFF;font-size:34px;font-weight:700}.subtitle{fill:#D1DED6;font-size:17px}.box{fill:#FFFFFF;stroke:#7BA18A;stroke-width:2}.classTitle{fill:#FFFFFF;font-size:22px;font-weight:700}.tableName{fill:#C8DED0;font-size:14px}.section{stroke:#DDE8E0;stroke-width:1.4}.association{stroke:#4B6958;stroke-width:2.4;fill:none}.relation{font-size:16px;font-weight:700;fill:#496353}.note{font-size:15px;fill:#607168}
</style></defs>
<rect width="1800" height="1280" fill="#F2F6F3"/><rect x="24" y="20" width="1752" height="1240" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="24" y="20" width="1752" height="132" rx="26" fill="#102D23"/><path d="M24 146 H1776" stroke="#E5B64B" stroke-width="5"/>
<text x="68" y="62" fill="#E8C76F" font-size="14" font-weight="700" letter-spacing="2">CAREERPULSE · MODÈLE V4</text><text x="68" y="106" class="title">Diagramme de classes</text><text x="68" y="132" class="subtitle">Classes persistées · Relations confirmées par le schéma SQL</text>
<rect x="60" y="185" width="1680" height="940" rx="22" fill="#FBFCFB" stroke="#DCE6DF" stroke-width="1.4"/>
<!-- Relations behind classes -->
<path class="association" d="M600 625 L700 700"/><path class="association" d="M1200 625 L1100 700"/>
<text x="584" y="616" class="relation">1</text><text x="682" y="704" class="relation">0..*</text><text x="619" y="673" class="relation">dépose</text>
<text x="1183" y="616" class="relation">1</text><text x="1100" y="704" class="relation">0..*</text><text x="1128" y="673" class="relation">concerne</text>
<!-- Utilisateur -->
<g><rect x="100" y="245" width="500" height="410" rx="14" class="box"/><path d="M100 259a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H100z" class="header"/><text x="126" y="278" class="classTitle">Utilisateur</text><text x="570" y="276" text-anchor="end" class="tableName">users</text>
<text x="126" y="337" class="mono">+id: int  «PK»</text><text x="126" y="363" class="mono">+name: varchar(120)</text><text x="126" y="389" class="mono">+email: varchar(190)  «UNIQUE»</text><text x="126" y="415" class="mono">+password_hash: varchar(255)</text><text x="126" y="441" class="mono">+study: varchar(160)</text><text x="126" y="467" class="mono">+skills: text?   +goal: text?</text><text x="126" y="493" class="mono">+status: ENUM(active, suspended)</text><text x="126" y="519" class="mono">+created_at: timestamp</text><path d="M100 542 H600" class="section"/><text x="126" y="576" class="mono">+create() · +findByEmail()</text><text x="126" y="606" class="mono">+updateProfile() · +sessionProfile()</text><text x="126" y="636" class="mono">+all() · +toggleStatus()</text></g>
<!-- Notification -->
<g><rect x="650" y="245" width="500" height="340" rx="14" class="box"/><path d="M650 259a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H650z" class="header"/><text x="676" y="278" class="classTitle">Notification</text><text x="1120" y="276" text-anchor="end" class="tableName">notifications</text>
<text x="676" y="337" class="mono">+id: int  «PK»</text><text x="676" y="363" class="mono">+title: varchar(200)</text><text x="676" y="389" class="mono">+body: varchar(500)</text><text x="676" y="415" class="mono">+is_read: bool</text><text x="676" y="441" class="mono">+created_at: timestamp</text><path d="M650 466 H1150" class="section"/><text x="676" y="502" class="mono">+all() · +markAllRead()</text></g>
<!-- Offre -->
<g><rect x="1200" y="245" width="500" height="410" rx="14" class="box"/><path d="M1200 259a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H1200z" class="header"/><text x="1226" y="278" class="classTitle">Offre</text><text x="1670" y="276" text-anchor="end" class="tableName">offers</text>
<text x="1226" y="337" class="mono">+id: varchar(20)  «PK»</text><text x="1226" y="363" class="mono">+title · company · type</text><text x="1226" y="389" class="mono">+category · location · skills</text><text x="1226" y="415" class="mono">+match_score: tinyint unsigned</text><text x="1226" y="441" class="mono">+status: varchar(20)</text><text x="1226" y="467" class="mono">+created_at: timestamp</text><path d="M1200 490 H1700" class="section"/><text x="1226" y="526" class="mono">+all() · +visibleToStudents()</text><text x="1226" y="556" class="mono">+findApplicable() · +exists()</text><text x="1226" y="586" class="mono">+setStatus()</text></g>
<!-- Formation -->
<g><rect x="100" y="760" width="500" height="300" rx="14" class="box"/><path d="M100 774a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H100z" class="header"/><text x="126" y="793" class="classTitle">Formation</text><text x="570" y="791" text-anchor="end" class="tableName">courses</text>
<text x="126" y="852" class="mono">+id: int  «PK»</text><text x="126" y="878" class="mono">+title · category · duration</text><text x="126" y="904" class="mono">+level · image · skills</text><path d="M100 928 H600" class="section"/><text x="126" y="967" class="mono">+all()</text></g>
<!-- Candidature -->
<g><rect x="650" y="700" width="500" height="360" rx="14" class="box"/><path d="M650 714a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H650z" class="header"/><text x="676" y="733" class="classTitle">Candidature</text><text x="1120" y="731" text-anchor="end" class="tableName">applications</text>
<text x="676" y="790" class="mono">+id: int  «PK»</text><text x="676" y="816" class="mono">+user_id: int  «FK»</text><text x="676" y="842" class="mono">+offer_id: varchar(20)  «FK»</text><text x="676" y="868" class="mono">+status: varchar(30)</text><text x="676" y="894" class="mono">+applied_at: date</text><path d="M650 919 H1150" class="section"/><text x="676" y="957" class="mono">+create() · +forUser()</text><text x="676" y="987" class="mono">+all() · +countPending() · +setStatus()</text></g>
<!-- Report -->
<g><rect x="1200" y="760" width="500" height="300" rx="14" class="box"/><path d="M1200 774a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v48H1200z" class="header"/><text x="1226" y="793" class="classTitle">Signalement</text><text x="1670" y="791" text-anchor="end" class="tableName">reports</text>
<text x="1226" y="852" class="mono">+id: varchar(20)  «PK»</text><text x="1226" y="878" class="mono">+subject · reason · status</text><text x="1226" y="904" class="mono">+created_at: timestamp</text><path d="M1200 928 H1700" class="section"/><text x="1226" y="967" class="mono">+all() · +countOpen() · +resolve()</text></g>
<text x="100" y="1170" class="note">Contrainte SQL : une candidature maximum par utilisateur et par offre (UNIQUE user_id + offer_id).</text>
<text x="100" y="1198" class="note">Formation, Signalement et Notification n’ont pas de clé étrangère dans le schéma V4; les notifications sont globales.</text>
</svg>
